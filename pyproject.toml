[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "spirallogic"
version = "0.1.2"
description = "A consciousness-aware programming language for ethical AI interaction"
readme = "README.md"
requires-python = ">=3.8"
license = { file = "LICENSE" }
authors = [
  { name = "Jimmy Thornburg", email = "thewritingvoices@gmail.com" },
]
keywords = ["programming-language", "ai-safety", "consent", "dsl", "ritual"]
dependencies = [
  "requests",
]

[project.urls]
Homepage = "https://github.com/TheFortThatHolds/spirallogic"
Repository = "https://github.com/TheFortThatHolds/spirallogic"
Issues = "https://github.com/TheFortThatHolds/spirallogic/issues"
Documentation = "https://github.com/TheFortThatHolds/spirallogic/blob/main/SPIRALLOGIC_COMPLETE_GUIDE.md"

[project.scripts]
spirallogic = "spirallogic.spirallogic_cli:main"

[tool.setuptools.packages.find]
where = ["src"]
