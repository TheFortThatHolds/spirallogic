name: Publish Python Package to PyPI

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: pypi

    permissions:
      id-token: write # This is required for OIDC

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x' # Use a compatible Python version

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build twine setuptools

      - name: Build package
        run: python -m build

      - name: Publish package to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
          # This is for OIDC. If you prefer API token, use:
          # password: ${{ secrets.PYPI_API_TOKEN }}
          # username: __token__
          # For OIDC, ensure your PyPI project is configured to trust your GitHub repository.
          # See: https://docs.pypi.org/trusted-publishers/
          # And: https://docs.github.com/en/actions/deployment/security-hardening-your-deployments/about-security-hardening-with-openid-connect
          # The 'pypi' environment above is also part of OIDC setup.
          # If you are not using OIDC, remove the 'environment' and 'permissions' lines above
          # and uncomment the 'password' and 'username' lines.
